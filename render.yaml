# ==============================================================================
# Render Blueprint Specification — Vehicle Management System (VMS) Backend
# ==============================================================================
services:
  - type: web
    name: vms-backend
    env: java
    plan: free
    buildCommand: "./mvnw clean package"
    startCommand: "java -jar target/vms-backend-0.0.1-SNAPSHOT.jar"
    healthCheckPath: "/health"
    envVars:
      - key: JAVA_VERSION
        value: "17"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.netlify.app,http://localhost:8080"
      - key: JWT_SECRET
        generateValue: true
      # Database connection variables (configure to your Render PostgreSQL instance)
      # - key: DB_URL
      #   value: jdbc:postgresql://<host>:5432/<dbname>
      # - key: DB_USERNAME
      #   value: <user>
      # - key: DB_PASSWORD
      #   value: <password>
