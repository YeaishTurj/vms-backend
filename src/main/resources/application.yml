spring:
  application:
    name: vms-backend
  data:
    web:
      pageable:
        page-serialization-mode: direct
  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:${JDBC_DATABASE_URL:${DATABASE_URL:${INTERNAL_DATABASE_URL:jdbc:postgresql://localhost:5432/vms_db}}}}}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

server:
  port: ${PORT:8081}

security:
  jwt:
    secret: ${JWT_SECRET:vms-super-secure-secret-key-for-jwt-signing-must-be-at-least-256-bits-long-2026}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours in milliseconds

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000,http://127.0.0.1:3000,https://*.netlify.app}

logging:
  level:
    root: INFO
    com.vms: INFO
    org.springframework.web: INFO
    org.hibernate: WARN
