spring:
  application:
    name: vms-backend-test
  data:
    web:
      pageable:
        page-serialization-mode: direct
  datasource:
    url: jdbc:h2:mem:vms_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false

server:
  port: 0

security:
  jwt:
    secret: vms-test-secure-secret-key-for-jwt-signing-must-be-at-least-256-bits-long-2026
    expiration-ms: 3600000 # 1 hour for testing
